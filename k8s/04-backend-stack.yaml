# Stack del Backend: Deployment + Service NodePort.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: practica-s08
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      restartPolicy: Always
      containers:
        - name: backend
          # Imagen construida localmente y cargada en Minikube (minikube image load).
          # IfNotPresent evita intentar descargarla de un registro remoto.
          image: agro-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000      # Debe coincidir con APP_PORT del ConfigMap
          # Todas las claves del ConfigMap y del Secret se convierten en variables de entorno:
          #   ConfigMap -> DB_HOST, DB_NAME, APP_PORT      Secret -> DB_USER, DB_PASS
          envFrom:
            - configMapRef:
                name: app-configmap
            - secretRef:
                name: db-secret
          readinessProbe:               # Recibe tráfico solo cuando la API responde
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:                # Reinicia el contenedor si deja de responder
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
# Service NodePort: expone el backend fuera del clúster en <IP-de-Minikube>:30080.
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: practica-s08
  labels:
    app: backend
spec:
  type: NodePort
  selector:
    app: backend               # Debe coincidir con las labels del Pod del Deployment
  ports:
    - port: 3000               # Puerto del Service dentro del clúster
      targetPort: 3000         # Puerto del contenedor (APP_PORT)
      nodePort: 30080          # Puerto externo (rango permitido: 30000-32767)
