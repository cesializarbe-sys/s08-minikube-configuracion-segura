# Secret (tipo Opaque): credenciales de MongoDB.
# - Los valores van codificados en Base64 (campo "data").
# - ATENCIÓN: Base64 es solo una CODIFICACIÓN, NO es cifrado. Cualquiera con acceso
#   de lectura al Secret puede decodificarlo. Su beneficio es separar las credenciales
#   de la configuración pública y poder controlarlas con RBAC.
# - Son credenciales DE LABORATORIO, sin ningún uso real. En producción no se
#   versionan Secrets en Git (usar Sealed Secrets, External Secrets, Vault, etc.).
#
# Cómo generar los valores (sin salto de línea final):
#   PowerShell: [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('valor'))
#   Linux/Mac : echo -n 'valor' | base64
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: practica-s08
  labels:
    app.kubernetes.io/part-of: agro-productos
type: Opaque
data:
  DB_USER: YWdyb19hZG1pbg==   # Base64 del usuario de laboratorio
  DB_PASS: TGFiUGFzc19TMDg=   # Base64 de la contraseña de laboratorio
